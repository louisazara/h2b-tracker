<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#132A3C">
<title>DealFlow Pro · H2B Capital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
/* ---------- Login screen ---------- */
.login-wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 28px}
.login-card .brandmark{display:flex;align-items:center;gap:11px;justify-content:center;margin-bottom:26px}
.login-card .brandmark img{width:38px;height:auto}
.login-card .brandmark .t1{font-family:var(--font);font-weight:700;font-size:17px;color:var(--navy);letter-spacing:.02em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .login-card .brandmark .t1{color:#fff}}
:root[data-theme="dark"] .login-card .brandmark .t1{color:#fff}
.login-card .brandmark .t1 span{color:var(--gold)}
.login-card h1{font-size:18px;margin:0 0 4px;text-align:center}
.login-card .sub{text-align:center;color:var(--muted);font-size:13.5px;margin:0 0 22px}
.login-card .fld{margin-bottom:14px}
.login-card .err{background:var(--red-bg);color:var(--red);border-radius:9px;padding:9px 12px;font-size:13.5px;margin-bottom:14px}
.login-card button[type=submit]{width:100%;justify-content:center;padding:11px;font-size:14.5px;margin-top:4px}
.login-card .note{text-align:center;color:var(--muted);font-size:12.5px;margin-top:18px}
.gate-loading{min-height:100%;display:grid;place-items:center;color:var(--muted)}
[hidden]{display:none!important}
</style>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --navy:#132A3C; --navy-2:#1B3549; --navy-3:#244259;
  --gold:#B8923F; --gold-2:#C2A14D; --gold-bg:#F5EDDC;
  --teal:#1B6B7D; --teal-bg:#E1EEF0;
  --red:#B4372B; --red-bg:#FBEAE7;
  --bg:#F2F4F6; --card:#FFFFFF; --line:#E1E5EA; --line-2:#EDF0F3;
  --ink:#1F2A33; --ink-2:#4A5864; --muted:#7A8793;
  --shadow:0 1px 2px rgba(19,42,60,.06),0 2px 8px rgba(19,42,60,.05);
  --font:"Segoe UI","Open Sans",system-ui,-apple-system,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1A24; --card:#142634; --line:#223A4C; --line-2:#1B3142;
  --ink:#E7ECF0; --ink-2:#B7C3CD; --muted:#8595A2;
  --gold-bg:#3A301A; --teal-bg:#153139; --red-bg:#3A1F1C; --teal:#5FAFC0; --red:#E78478;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#0D1A24; --card:#142634; --line:#223A4C; --line-2:#1B3142;
  --ink:#E7ECF0; --ink-2:#B7C3CD; --muted:#8595A2;
  --gold-bg:#3A301A; --teal-bg:#153139; --red-bg:#3A1F1C; --teal:#5FAFC0; --red:#E78478;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg.i{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Layout ---------- */
.app{display:flex;height:100%}
.side{width:256px;flex:0 0 256px;background:var(--navy);color:#DCE4EA;display:flex;flex-direction:column;height:100%;overflow:hidden}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand img{width:40px;height:auto}
.brand .t1{font-weight:700;font-size:15.5px;letter-spacing:.03em;color:#fff;line-height:1.1}
.brand .t1 span{color:var(--gold-2)}
.brand .t2{font-size:11.5px;color:#93A6B6;margin-top:2px}
.search{position:relative;margin:14px 14px 8px}
.search input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:9px 10px 9px 34px;color:#fff;font-size:14px}
.search input::placeholder{color:#8A9DAD}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#8A9DAD}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);color:var(--ink);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:30;max-height:340px;overflow:auto;padding:6px}
.results .g{font-size:11px;font-weight:700;color:var(--muted);padding:8px 8px 4px;letter-spacing:.05em}
.results button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:7px;font-size:14px}
.results button:hover{background:var(--bg)}
.results .none{padding:12px 8px;color:var(--muted);font-size:14px}
.nav{flex:1;overflow:auto;padding:6px 10px 12px}
.nav a,.nav button.nl{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:9px;color:#C9D4DC;text-decoration:none;font-weight:600;font-size:14.5px;background:none;border:0;text-align:left}
.nav a:hover,.nav button.nl:hover{background:rgba(255,255,255,.06);color:#fff}
.nav .on{background:rgba(194,161,77,.16)!important;color:var(--gold-2)!important}
.nav .badge{margin-left:auto;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px;background:var(--red);color:#fff}
.nav .chev{margin-left:auto;transition:transform .2s;width:16px;height:16px}
.nav .open .chev{transform:rotate(90deg)}
.plist{margin:2px 0 6px 21px;padding-left:12px;border-left:1px solid rgba(255,255,255,.12)}
.plist a{padding:7px 10px;font-weight:500;font-size:13.5px}
.plist .prow{display:flex;align-items:center;position:relative}
.plist .prow a{flex:1;min-width:0}
.plist .sidemove{display:flex;flex-direction:column;opacity:0;transition:opacity .15s}
.plist .prow:hover .sidemove,.plist .prow:focus-within .sidemove{opacity:1}
.plist .sidemove button{background:none;border:0;color:#8A9DAD;padding:0 4px;height:13px;display:grid;place-items:center}
.plist .sidemove button:hover:not(:disabled){color:var(--gold-2)}
.plist .sidemove button:disabled{opacity:.25}
.plist .sidemove svg{width:12px;height:12px}
@media (hover:none){ .plist .sidemove{opacity:1} }
.plist .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.plist .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .add{color:var(--gold-2)}
.plist .empty{font-size:13px;color:#8A9DAD;padding:6px 10px}
.me{display:flex;align-items:center;gap:10px;padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;text-align:left;width:100%}
.me .n{font-weight:700;color:#fff;font-size:14px}
.me .r{font-size:12px;color:#93A6B6}

.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:12px;background:var(--card);border-bottom:1px solid var(--line);padding:0 24px;min-height:64px;position:sticky;top:0;z-index:10}
.top h1{font-size:19px;margin:0;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-btn{display:none;background:none;border:0;padding:8px;margin-left:-8px;border-radius:8px}
.content{flex:1;overflow:auto;padding:22px 24px 110px}
.wrap{max-width:1280px;margin:0 auto}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 13px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.gold:hover{background:#A6822F}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--muted)}
.icon-btn svg{width:15px;height:15px}
.fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--gold);color:#fff;border:0;display:grid;place-items:center;box-shadow:0 6px 18px rgba(184,146,63,.45);z-index:25}
.fab svg{width:24px;height:24px}
.fab-menu{position:fixed;right:22px;bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:6px;z-index:26;min-width:180px}
.fab-menu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:11px 12px;border-radius:8px;font-weight:600;text-align:left}
.fab-menu button:hover{background:var(--bg)}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.card-h h2{font-size:15px;margin:0;font-weight:700;flex:1}
.card-h .sub{font-weight:400;color:var(--muted);font-size:13px}
.card-b{padding:4px 18px 16px}
.empty-state{padding:26px 18px;text-align:center;color:var(--muted);font-size:14px}
.empty-state .btn{margin-top:10px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.kpi{padding:16px 18px;border-top:3px solid var(--gold);position:relative;cursor:pointer;text-align:left;width:100%;font:inherit}
.kpi.b2{border-top-color:var(--navy)} .kpi.b3{border-top-color:var(--teal)} .kpi.b4{border-top-color:var(--red)}
.kpi .l{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.kpi .v{font-size:30px;font-weight:700;margin:4px 0 2px;line-height:1.1}
.kpi .s{font-size:13px;color:var(--ink-2)}
.kpi svg{position:absolute;right:16px;top:16px;width:22px;height:22px;color:var(--line);stroke-width:1.5}

.grid-dash{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;align-items:start}
.col{display:grid;gap:18px}

.bars .row{display:grid;grid-template-columns:120px 1fr 28px;gap:12px;align-items:center;padding:5px 0;background:none;border:0;width:100%;text-align:left;border-radius:6px}
.bars .row:hover .lbl{color:var(--ink)}
.bars .lbl{font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .track{display:block;height:8px;border-radius:4px;background:var(--line-2);overflow:hidden}
.bars .fill{display:block;height:100%;border-radius:4px;background:var(--gold)}
.bars .n{font-weight:700;font-size:13.5px;text-align:right}

.wl{display:grid;grid-template-columns:32px 1fr 90px 22px;gap:10px;align-items:center;padding:7px 0}
.wl .nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl .track{display:block;height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.wl .fill{display:block;height:100%;background:var(--teal);border-radius:3px}
.wl .n{font-weight:700;font-size:13.5px;text-align:right}

.act{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line-2);font-size:13.5px}
.act:first-child{border-top:0}
.act .t{color:var(--muted);font-size:12px;white-space:nowrap;margin-left:auto;padding-left:8px}

.av{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:inline-grid;place-items:center;font-weight:700;font-size:11px;flex:0 0 auto;border:2px solid var(--card)}
.av.lg{width:58px;height:58px;font-size:19px;color:var(--gold-2);border-width:3px}
.avs{display:flex}
.avs .av{margin-left:-7px;width:26px;height:26px;font-size:10px}
.avs .av:first-child{margin-left:0}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--line-2);color:var(--ink-2)}
.pill.High{background:var(--red-bg);color:var(--red)}
.pill.Medium{background:var(--gold-bg);color:#8C6A1F}
.pill.Low{background:var(--teal-bg);color:var(--teal)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.Medium{color:#D9B566}}
.pill.stage{background:var(--teal-bg);color:var(--teal)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:1px 9px;background:var(--card);white-space:nowrap}
.due{font-size:12.5px;color:var(--muted);white-space:nowrap}
.due.over{color:var(--red);font-weight:600}
.due.today{color:#8C6A1F;font-weight:600}

/* ---------- Task rows ---------- */
.tasks{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line-2)}
.task:first-child{border-top:0}
.task.over{background:color-mix(in srgb,var(--red-bg) 55%,transparent)}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.check{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;color:#fff}
.check.on{background:var(--teal);border-color:var(--teal)}
.check svg{width:13px;height:13px;stroke-width:3}
.task .ttl{font-weight:600;font-size:14.5px;background:none;border:0;padding:0;text-align:left}
.task .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:3px}
.task .plink{font-size:12.5px;color:var(--teal);background:none;border:0;padding:0;font-weight:600}
.task .side-meta{display:flex;align-items:center;gap:10px}
.task .acts{display:flex;gap:6px}

.group-h{display:flex;align-items:baseline;gap:10px;margin:22px 2px 8px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink-2);text-transform:uppercase}
.task[draggable="true"]{cursor:grab}
.tasks.drop{outline:2px dashed var(--gold);outline-offset:-2px;border-radius:10px}
.task-wrap{border-top:1px solid var(--line-2)}
.tasks .task-wrap:first-child{border-top:0}
.task-wrap .task{border-top:0}
.ttl-wrap{display:block;min-width:0}
.ttl-wrap .ttl{font-weight:600;font-size:14.5px}
.chip.event{background:var(--teal-bg);color:var(--teal)}
.chip.sub-toggle{cursor:pointer}
.chip.sub-toggle svg{width:11px;height:11px;transform:rotate(90deg)}
.subtasks{padding:2px 18px 12px 52px;display:flex;flex-direction:column;gap:6px}
.subtask{display:flex;align-items:center;gap:9px;font-size:14px}
.subtask.done span{text-decoration:line-through;color:var(--muted)}
.subcheck{width:17px;height:17px;border-radius:5px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;color:#fff;flex:0 0 auto}
.subcheck.on{background:var(--teal);border-color:var(--teal)}
.subcheck svg{width:11px;height:11px;stroke-width:3.4}
.icon-btn.sm{width:24px;height:24px}
.icon-btn.sm svg{width:12px;height:12px}
.subtask-add{display:flex;gap:6px;margin-top:2px}
.subtask-add input{flex:1;border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:var(--card);font-size:13.5px}
.task-notes{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
.task-files{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.file-chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;color:var(--teal);text-decoration:none}
.file-chip svg{width:13px;height:13px}
.done-section{margin-top:22px;border:1px dashed var(--line);border-radius:12px;background:var(--card)}
.done-section.drop{outline:2px dashed var(--gold);outline-offset:-2px}
.done-section summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:8px;font-family:var(--head,inherit);font-weight:700;font-size:12.5px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.done-section summary::-webkit-details-marker{display:none}
.done-section .dhint{font-weight:400;text-transform:none;letter-spacing:0;font-size:12.5px;margin-left:auto;color:var(--muted)}
.done-section[open] summary{border-bottom:1px solid var(--line-2)}
.file-input-hidden{display:none}
.upload-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.upload-row{display:flex;align-items:center;gap:8px;font-size:13.5px}
.upload-row a{flex:1;color:var(--teal);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group-h span{font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted)}
.alert{display:flex;align-items:center;gap:8px;background:var(--red-bg);color:var(--red);border:1px solid color-mix(in srgb,var(--red) 30%,transparent);border-radius:10px;padding:11px 14px;font-weight:600;font-size:14px;margin-bottom:6px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--navy);color:#fff}
.spacer{flex:1}
.lbl-s{font-size:13px;color:var(--muted)}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2);cursor:pointer}

/* ---------- Board ---------- */
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity;align-items:flex-start;min-height:calc(100vh - 200px)}
.colm{flex:0 0 272px;background:color-mix(in srgb,var(--line-2) 70%,var(--bg));border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 190px);scroll-snap-align:start}
.colm.drop{outline:2px dashed var(--gold);outline-offset:-2px}
.colm-h{display:flex;align-items:center;gap:8px;padding:13px 14px;font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.colm-h .cnt{margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:11.5px;padding:0 7px;min-width:22px;text-align:center}
.colm-b{padding:0 10px 10px;overflow:auto;display:flex;flex-direction:column;gap:10px;flex:1}
.colm .add{margin:0 10px 10px;border:1px dashed var(--line);background:none;border-radius:9px;padding:8px;color:var(--muted);font-size:13.5px;font-weight:600}
.colm .add:hover{color:var(--gold);border-color:var(--gold)}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 14px;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%}
.pcard:hover{border-color:var(--gold-2)}
.pcard[draggable="true"]{cursor:grab}
.pcard h3{font-size:14.5px;margin:0 0 3px;line-height:1.3}
.pcard .m{font-size:12.5px;color:var(--ink-2)}
.pcard .sum{font-size:12.5px;color:var(--muted);margin:8px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .f{display:flex;align-items:center;gap:8px;margin-top:10px}
.prog{height:4px;border-radius:2px;background:var(--line-2);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--teal)}

/* ---------- Project page ---------- */
.phead{padding:20px 22px}
.phead .row1{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.phead h2{margin:0;font-size:22px;flex:1;min-width:200px}
.phead .facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px}
.phead .facts div{font-size:13px;color:var(--muted)}
.phead .facts b{display:block;color:var(--ink);font-size:14.5px;font-weight:600}
.phead .sum{margin:14px 0 0;color:var(--ink-2);max-width:75ch}
.stepper{display:flex;gap:4px;overflow-x:auto;padding:4px 22px 18px;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.stepper button{flex:1 0 auto;border:0;background:var(--line-2);color:var(--muted);font-size:12px;font-weight:600;padding:8px 10px;border-radius:6px;white-space:nowrap}
.stepper button.past{background:var(--teal-bg);color:var(--teal)}
.stepper button.cur{background:var(--navy);color:#fff}
.pgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
.quick{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line-2)}
.quick input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--card)}
textarea.notes{width:100%;min-height:160px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--card);resize:vertical;line-height:1.5}
.saved{font-size:12px;color:var(--muted)}

/* ---------- Team ---------- */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.mcard{padding:20px 16px 16px;text-align:center;position:relative;cursor:pointer}
.mcard.isme{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.mcard .tag{position:absolute;left:12px;top:10px;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--gold)}
.mcard .ed{position:absolute;right:10px;top:10px;display:flex;gap:5px}
.mcard h3{margin:10px 0 0;font-size:16px}
.mcard .role{color:var(--muted);font-size:13.5px}
.mcard .stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px}
.mcard .stats b{display:block;font-size:19px}
.mcard .stats span{font-size:10.5px;font-weight:600;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.hint{color:var(--ink-2);margin:0 0 16px;font-size:14px}

/* ---------- Settings ---------- */
.set-list{display:flex;flex-direction:column;gap:6px}
.set-row{display:flex;gap:6px;align-items:center}
.set-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card)}
.set-row .cnt{font-size:12px;color:var(--muted);width:66px;text-align:right}


/* ---------- Calendar ---------- */
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.cal-head div{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--muted);text-align:center;text-transform:uppercase}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{min-height:92px;border:1px solid var(--line-2);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cal-cell.empty{border-color:transparent;background:none}
.cal-cell.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.cal-cell .dn{font-size:11.5px;font-weight:700;color:var(--muted)}
.cal-cell.today .dn{color:var(--gold)}
.cal-item{border:0;border-radius:5px;padding:2px 5px;font-size:11px;text-align:left;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.cal-item.ev{background:var(--navy);color:#fff}
.cal-item.tk{background:var(--teal-bg);color:var(--teal)}
.cal-item.tk.over{background:var(--red-bg);color:var(--red)}
@media (max-width:760px){
  .cal-cell{min-height:64px;padding:3px}
  .cal-item{font-size:9.5px;padding:1px 3px}
  .cal-cell .dn{font-size:10px}
}
/* ---------- Category board on project page ---------- */
.catboard{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;scroll-snap-type:x proximity}
.catcol{flex:0 0 288px;background:color-mix(in srgb,var(--line-2) 70%,var(--bg));border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 260px);scroll-snap-align:start}
.catcol.drop{outline:2px dashed var(--gold);outline-offset:-2px}
.catcol-h{display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.catcol-h .colmove{display:flex;gap:3px;margin-left:4px}
.catcol-h .colmove .icon-btn{width:22px;height:22px}
.catcol-h .colmove svg{width:12px;height:12px}
.pcard .pmove{display:flex;gap:3px;margin-left:auto}
.pcard .pmove .icon-btn{width:22px;height:22px}
.pcard .pmove svg{width:12px;height:12px}
.catcol-h .cnt{margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:11.5px;padding:0 7px;min-width:22px;text-align:center}
.catcol-b{padding:0 10px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;flex:1;min-height:40px}
.catcol .add{margin:0 10px 10px;border:1px dashed var(--line);background:none;border-radius:9px;padding:8px;color:var(--muted);font-size:13.5px;font-weight:600}
.catcol .add:hover{color:var(--gold);border-color:var(--gold)}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;box-shadow:var(--shadow);text-align:left;width:100%;cursor:pointer}
.tcard:hover{border-color:var(--gold-2)}
.tcard.done .tt{text-decoration:line-through;color:var(--muted)}
.tcard .tt{font-weight:600;font-size:14px;display:block;margin-bottom:5px}
.tcard .row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tcard .tick{width:18px;height:18px;border-radius:5px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;color:#fff;flex:0 0 auto;margin-right:7px;vertical-align:-3px}
.tcard .tick.on{background:var(--teal);border-color:var(--teal)}
.tcard .tick svg{width:11px;height:11px;stroke-width:3.4}
@media (max-width:760px){
  .catboard{flex-direction:column;overflow:visible;margin:0}
  .catcol{flex:none;max-height:none}
  .catcol.hidden-empty{display:none}
}
.jumpbar{display:none;gap:6px;overflow-x:auto;margin:0 -12px 12px;padding:0 12px;scrollbar-width:none}
.jumpbar::-webkit-scrollbar{display:none}
.jumpbar button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.jumpbar button b{color:var(--gold);margin-left:4px}
@media (max-width:760px){ .jumpbar{display:flex} }


.comments{display:flex;flex-direction:column;gap:10px;margin-bottom:8px;max-height:260px;overflow:auto}
.comment{display:flex;gap:9px;align-items:flex-start}
.comment .av{width:26px;height:26px;font-size:10px;border:0}
.comment .ch{display:flex;gap:8px;align-items:baseline;font-size:12.5px}
.comment .ch span{color:var(--muted)}
.comment p{margin:2px 0 0;font-size:14px;color:var(--ink)}
.comment-add{display:flex;gap:8px;align-items:flex-end}
.comment-add textarea{flex:1;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--card);resize:vertical;min-height:0;font-size:14px}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer}
.chip.recur{background:var(--gold-bg);color:#8C6A1F;border-color:transparent}
.chip.recur svg,.chip.linkchip svg,.chip.cmt svg{width:11px;height:11px}
.chip.linkchip{color:var(--teal);text-decoration:none}
.chip.linkchip:hover{border-color:var(--teal)}

/* ---------- This Week ---------- */
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wday{border:1px solid var(--line-2);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0;min-height:150px}
.wday.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.wday.wkend{background:color-mix(in srgb,var(--line-2) 45%,transparent)}
.wd-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted)}
.wd-h b{color:var(--ink);font-size:12.5px}
.wday.today .wd-h b{color:var(--gold)}
.wd-bar{height:34px;background:var(--line-2);border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}
.wd-bar i{display:block;width:100%;background:var(--teal);border-radius:5px 5px 0 0;opacity:.8}
.wd-items{display:flex;flex-direction:column;gap:3px;min-width:0}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.person .card-h{gap:10px;flex-wrap:wrap}
.person .card-h h2{flex:1;min-width:120px}
.person .pstat{display:flex;gap:5px}
.person .more{padding:8px 18px 12px;font-size:13px;color:var(--muted)}
.pulse{display:flex;flex-direction:column}
.pr{display:grid;grid-template-columns:minmax(0,2fr) 172px 48px 66px minmax(0,1.4fr);gap:10px;align-items:center;padding:10px 16px;border:0;border-top:1px solid var(--line-2);background:none;text-align:left;width:100%;font-size:14px}
.pr:first-child{border-top:0}
button.pr:hover{background:var(--line-2)}
.pr.ph{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;padding-top:12px}
.pr .pn{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0;flex-wrap:wrap}
.pr .pn .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.pr small{display:block;font-weight:400;color:var(--muted);font-size:12px;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .pn small{padding-left:16px}
.pr .bad{color:var(--red);font-weight:700}
.pr .nd{min-width:0}
@media (max-width:760px){
  .wstrip{grid-template-columns:1fr;gap:6px}
  .wday{min-height:0;flex-direction:row;align-items:flex-start;gap:10px}
  .wday .wd-h{flex-direction:column;min-width:38px}
  .wd-bar{display:none}
  .wd-items{flex:1}
  .wday:not(:has(.cal-item)){opacity:.55}
  .people{grid-template-columns:1fr}
  .pr{grid-template-columns:minmax(0,1fr) auto 36px;padding:10px 12px}
  .pr > :nth-child(4),.pr > :nth-child(5){display:none}
}

.narrow .task{grid-template-columns:24px 1fr}
.narrow .task .side-meta{grid-column:2;flex-wrap:wrap;gap:6px 8px}
.narrow .task .acts{display:none}

/* ---------- Mandate status ---------- */
.spill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px 3px 8px;border-radius:999px;white-space:nowrap;
  color:var(--sc);background:color-mix(in srgb,var(--sc) 14%,transparent)}
.spill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc)}
.spill.empty{--sc:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .spill{color:color-mix(in srgb,var(--sc) 55%,#fff);background:color-mix(in srgb,var(--sc) 28%,transparent)}}
.stale{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--red);white-space:nowrap}
.stale svg{width:13px;height:13px}
.stale.sm{margin-left:4px}
.statusblk{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--line-2) 40%,transparent)}
.statusblk.is-stale{border-color:color-mix(in srgb,var(--red) 40%,transparent);background:color-mix(in srgb,var(--red-bg) 55%,transparent)}
.sb-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sb-top .btn{margin-left:auto}
.sb-when{font-size:12.5px;color:var(--muted)}
.sb-next{margin-top:10px}
.sb-next b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.sb-next p{margin:0;font-size:14.5px;color:var(--ink)}
.sb-next.empty{font-size:13.5px;color:var(--muted);font-style:italic}
.pc-status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.pc-next{margin:6px 0 0;font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;border-left:2px solid var(--gold-2);padding-left:7px}
.pr .pst{display:flex;align-items:center;min-width:0;gap:2px}
.pr .pst .spill{min-width:0;overflow:hidden;text-overflow:ellipsis}
.pr .pst .stale{flex:0 0 auto}
.colorsel{width:92px;flex:0 0 auto;border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--card);font-size:13px;
  color:var(--sc);font-weight:700;border-left:6px solid var(--sc)}
.needs-list{display:flex;flex-direction:column}
.need{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line-2)}
.need:first-child{border-top:0}
.need .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.need .nm{background:none;border:0;padding:0;font-weight:600;font-size:14px;text-align:left}
.need .why{font-size:12.5px;color:var(--muted);margin-right:auto}
/* ---------- Sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,22,32,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{background:var(--card);border-radius:16px;width:100%;max-width:520px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet-h{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0;font-size:17px;flex:1}
.sheet-b{padding:16px 20px;overflow:auto;display:grid;gap:14px}
.sheet-f{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--card);font-size:15px}
.fld textarea{min-height:90px;resize:vertical}
.fld .help{font-size:12px;color:var(--muted);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.picks button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px 5px 5px;font-size:13.5px;display:inline-flex;align-items:center;gap:7px}
.picks button .av{width:22px;height:22px;font-size:9px;border:0}
.picks button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.picks button.on .av{background:var(--gold)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.banner{background:var(--gold-bg);color:#6E531A;font-size:13px;padding:8px 24px;border-bottom:1px solid var(--line)}
.loading{display:grid;place-items:center;height:60vh;color:var(--muted)}

.bnav{display:none}
.jump{display:none;gap:6px;overflow-x:auto;margin:0 -12px 12px;padding:0 12px;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.jump button b{color:var(--gold);margin-left:4px}
.drawer-scrim{display:none}

/* ---------- Responsive ---------- */
@media (max-width:1180px){ .kpis{grid-template-columns:repeat(2,1fr)} }
@media (max-width:1024px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px)}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .drawer-scrim.on{display:block;position:fixed;inset:0;background:rgba(10,22,32,.45);z-index:39}
  .menu-btn{display:grid}
  .grid-dash,.pgrid{grid-template-columns:1fr}
}
@media (max-width:760px){
  body{font-size:15.5px}
  .top{padding:0 14px;min-height:56px}
  .top h1{font-size:17px}
  .top .btn .lbl{display:none}
  .content{padding:14px 12px calc(96px + env(safe-area-inset-bottom,0px))}
  .kpis{gap:10px;margin-bottom:14px}
  .kpi{padding:13px 14px}
  .kpi .v{font-size:25px}
  .kpi svg{display:none}
  .bars .row{grid-template-columns:96px 1fr 22px}
  .task{grid-template-columns:24px 1fr;padding:12px 14px}
  .task .side-meta{grid-column:2;flex-wrap:wrap}
  .task .acts{display:none}
  .toolbar .lbl-s{display:none}
  .card-h{padding:14px 14px 8px}.card-b{padding:4px 14px 14px}
  .board{flex-direction:column;align-items:stretch;overflow:visible;min-height:0;padding:0}
  .colm{flex:none;max-height:none}
  .colm.empty{display:none}
  .board-note{display:block!important}
  .phead{padding:16px}.stepper{padding:4px 16px 16px}
  .scrim{align-items:flex-end;padding:0}
  .sheet{border-radius:18px 18px 0 0;max-height:92vh}
  .two{grid-template-columns:1fr}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:24;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bnav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
  .bnav button.on{color:var(--navy)}
  @media (prefers-color-scheme:dark){.bnav button.on{color:var(--gold-2)}}
  .bnav svg{width:21px;height:21px}
  .bnav .dotb{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
  .fab{bottom:calc(72px + env(safe-area-inset-bottom,0px));right:16px;width:52px;height:52px}
  .fab-menu{bottom:calc(132px + env(safe-area-inset-bottom,0px));right:16px}
  .toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="gate-loading" id="gate">Loading…</div>

const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmtDate = s => { if(!s) return ''; const [y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d); const opts={month:'short',day:'numeric'}; if(y!==new Date().getFullYear()) opts.year='numeric'; return dt.toLocaleDateString(undefined,opts); };
const isDone = t => t.status==='Done';
const isOver = t => !isDone(t) && t.due && t.due < todayStr();
const isToday = t => !isDone(t) && t.due === todayStr();
function dueHTML(t){
  if(!t.due) return '<span class="due">No due date</span>';
  if(isOver(t)) return `<span class="due over">Overdue · ${fmtDate(t.due)}</span>`;
  if(isToday(t)) return `<span class="due today">Due today</span>`;
  return `<span class="due">Due ${fmtDate(t.due)}</span>`;
}
function ago(ts){ const s=(Date.now()-ts)/1000; if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago'; if(s<604800) return Math.floor(s/86400)+'d ago'; return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }

/* ---------- Data writes ---------- */
async function put(col,id,data){
  if(READONLY){ toast('This account can\'t save changes. Check with your admin.'); return false; }
  // optimistic local update so the UI responds instantly
  if(col==='settings') S.config=data; else S[col][id]={...data,id};
  render();
  try{ const clean={...data}; delete clean.id; await fs.collection(col).doc(id).set(clean); return true; }
  catch(e){ handleErr(e); return false; }
}
async function del(col,id){
  if(READONLY){ toast('This account can\'t save changes. Check with your admin.'); return; }
  delete S[col][id]; render();
  try{ await fs.collection(col).doc(id).delete(); }catch(e){ handleErr(e); }
}
function handleErr(e){
  if(e && e.code==='permission-denied'){ READONLY=true; toast('This account doesn\'t have permission to make changes.'); render(); return; }
  if(e && e.code==='resource-exhausted'){ toast('Too many changes at once — wait a moment and try again.'); return; }
  toast('Couldn\'t save that change. Check your connection and try again.');
}
function log(text){
  if(READONLY) return;
  const m=me(); const id=uid();
  const a={text, who:m?m.id:null, at:Date.now()};
  S.activity[id]={...a,id};
  fs.collection('activity').doc(id).set(a).catch(()=>{});
  // keep the log short
  const old=list('activity').sort((x,y)=>y.at-x.at).slice(60);
  old.forEach(x=>{ delete S.activity[x.id]; fs.collection('activity').doc(x.id).delete().catch(()=>{}); });
}

function startApp(user){
  CURRENT_USER=user;
  document.getElementById('gate').hidden=true;
  document.getElementById('loginScreen').hidden=true;
  document.getElementById('appRoot').hidden=false;
  document.getElementById('bnav').hidden=false;
  render();
  let pending=new Set(['projects','tasks','members','events','comments','activity','settings']);
  const done=k=>{ pending.delete(k); if(!pending.size){ S.ready=true; matchMe(); migrateEvents(); } render(); };
  ['projects','tasks','members','events','comments','activity'].forEach(col=>{
    unsubs.push(fs.collection(col).onSnapshot(snap=>{
      S[col]=Object.fromEntries(snap.docs.map(d=>[d.id,{...d.data(),id:d.id}]));
      done(col);
    }, err=>{ if(err.code==='permission-denied') READONLY=true; done(col); }));
  });
  unsubs.push(fs.doc('settings/config').onSnapshot(d=>{ S.config = d.exists ? d.data() : null; done('settings'); }, ()=>done('settings')));
  setTimeout(()=>{ if(!S.ready){ S.ready=true; render(); } }, 8000);
}

// one-time upgrade: old free-text `event` strings become real Event records
async function migrateEvents(){
  if(READONLY) return;
  if((cfg().schemaVersion||1) >= 2) return;
  const legacy = tasks().filter(t=>t.event && !t.eventId);
  const byTitle = {};
  events().forEach(e=>{ byTitle[e.title.trim().toLowerCase()] = e.id; });
  for(const t of legacy){
    const key = t.event.trim().toLowerCase();
    if(!byTitle[key]){
      const id = uid();
      const p = S.projects[t.projectId];
      await put('events', id, {id, title:t.event.trim(), type:'Meeting', date:t.due||'', time:'',
        projectIds: p?[p.id]:[], notes:'', createdAt:Date.now()});
      byTitle[key] = id;
    }
    await put('tasks', t.id, {...t, eventId:byTitle[key], event:null, updatedAt:Date.now()});
  }
  saveCfg({schemaVersion:2});
}

// merge/rename existing categories onto the suggested set, keeping every task attached
function applySuggestedCats(){
  const cur = cats();
  const targetOf = c => CAT_RENAME[(c.name||'').trim().toLowerCase()] || c.name;
  const keep = [];      // {id,name}
  const remap = {};     // oldId -> keptId
  cur.forEach(c=>{
    const name = targetOf(c);
    const already = keep.find(k=>k.name===name);
    if(already){ remap[c.id] = already.id; }
    else { keep.push({id:c.id, name}); }
  });
  SUGGESTED_CATS.forEach(name=>{ if(!keep.find(k=>k.name===name)) keep.push({id:uid(), name}); });
  keep.sort((a,b)=>SUGGESTED_CATS.indexOf(a.name)-SUGGESTED_CATS.indexOf(b.name));
  Object.entries(remap).forEach(([oldId,newId])=>{
    tasks().filter(t=>(t.category||'general')===oldId).forEach(t=>put('tasks',t.id,{...t,category:newId,updatedAt:Date.now()}));
  });
  saveCfg({categories:keep});
  toast('Categories updated. Nothing was unassigned.');
}


/* ---------- Recurring tasks ---------- */
const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const RECUR_OPTS = [['none','Does not repeat'],['daily','Every weekday'],['weekly','Every week'],['biweekly','Every 2 weeks'],['monthly','Every month']];
const dstr = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dparse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d,12); };
// the next due date strictly after `fromStr` (or on/after today if no date yet)
function nextOccurrence(r, fromStr, inclusive){
  if(!r || r.freq==='none') return '';
  let d = fromStr ? dparse(fromStr) : dparse(todayStr());
  const step = () => d.setDate(d.getDate()+1);
  if(!inclusive) step();
  if(r.freq==='daily'){ while(d.getDay()===0||d.getDay()===6) step(); return dstr(d); }
  if(r.freq==='weekly'||r.freq==='biweekly'){
    const wd = Number(r.weekday ?? 5);
    while(d.getDay()!==wd) step();
    if(r.freq==='biweekly' && !inclusive && fromStr) d.setDate(d.getDate()+7);
    return dstr(d);
  }
  if(r.freq==='monthly'){
    const md = Number(r.monthDay || (fromStr?dparse(fromStr).getDate():new Date().getDate()));
    let y=d.getFullYear(), m=d.getMonth();
    const clamp=(yy,mm)=>Math.min(md,new Date(yy,mm+1,0).getDate());
    let cand=new Date(y,m,clamp(y,m),12);
    if(cand<d){ m++; if(m>11){m=0;y++;} cand=new Date(y,m,clamp(y,m),12); }
    return dstr(cand);
  }
  return '';
}
function recurLabel(r){
  if(!r || r.freq==='none') return '';
  if(r.freq==='daily') return 'Every weekday';
  if(r.freq==='weekly') return 'Weekly · '+WEEKDAYS[Number(r.weekday??5)].slice(0,3);
  if(r.freq==='biweekly') return 'Every 2 wks · '+WEEKDAYS[Number(r.weekday??5)].slice(0,3);
  if(r.freq==='monthly') return 'Monthly';
  return '';
}
// when a repeating task is completed, queue up the next one (once)
function spawnNextIfRecurring(t){
  if(!t.recur || t.recur.freq==='none' || t.spawnedNext) return null;
  // anchor on the due date, but never schedule the next one in the past if this was finished late
  const y=new Date(); y.setDate(y.getDate()-1); const yest=dstr(y);
  const anchor = (t.due && t.due > yest) ? t.due : yest;
  const nextDue = nextOccurrence(t.recur, anchor, false);
  const id = uid();
  const next = {...t, id, due:nextDue, status:'To Do', doneAt:null, spawnedNext:false,
    subtasks:(t.subtasks||[]).map(s=>({...s, id:uid(), done:false})),
    createdAt:Date.now(), updatedAt:Date.now(), seriesId:t.seriesId||t.id};
  put('tasks', id, next);
  return id;
}
// mark done + spawn the next occurrence in one place, so every path behaves the same
function completeTask(t){
  const nextId = spawnNextIfRecurring(t);
  put('tasks', t.id, {...t, status:'Done', doneAt:Date.now(), spawnedNext: !!nextId || !!t.spawnedNext, updatedAt:Date.now()});
  log(`completed "${t.title}"`);
  if(nextId) toast(`Next one scheduled for ${fmtDate(S.tasks[nextId]?.due)}.`);
}

/* ---------- Backup ---------- */
function exportBackup(){
  const payload = {exportedAt:new Date().toISOString(), version:3,
    projects:S.projects, tasks:S.tasks, members:S.members, events:S.events, comments:S.comments, config:S.config};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dealflow-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast('Backup downloaded.');
}
async function restoreBackup(file){
  let data;
  try{ data = JSON.parse(await file.text()); }
  catch(e){ toast('That file isn\'t a valid backup.'); return; }
  if(!data.projects || !data.tasks){ toast('That file doesn\'t look like a DealFlow backup.'); return; }
  const counts = [Object.keys(data.projects||{}).length+' projects', Object.keys(data.tasks||{}).length+' tasks',
    Object.keys(data.members||{}).length+' people'].join(', ');
  confirmBox('Restore this backup?', 'This replaces everything currently in the workspace with '+counts+' from the backup file. Anything added since the backup is lost.', 'Restore', async ()=>{
    for(const col of ['projects','tasks','members','events','comments']){
      const incoming = data[col]||{};
      for(const id of Object.keys(S[col]||{})) if(!incoming[id]) await del(col,id);
      for(const [id,doc] of Object.entries(incoming)) await put(col,id,{...doc,id});
    }
    if(data.config) await put('settings','config',data.config);
    toast('Backup restored.');
  });
}


function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function viewCalendar(){
  const cur = UI.calMonth ? new Date(UI.calMonth+'-01T12:00:00') : new Date();
  const y=cur.getFullYear(), mo=cur.getMonth();
  const first=new Date(y,mo,1), startDow=first.getDay();
  const daysInMonth=new Date(y,mo+1,0).getDate();
  const today=todayStr();
  const cells=[];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(y+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'));
  while(cells.length%7) cells.push(null);
  const evByDate={}, tkByDate={};
  events().forEach(e=>{ if(e.date){ (evByDate[e.date]=evByDate[e.date]||[]).push(e); } });
  if(UI.calTasks!==false) tasks().filter(t=>t.due&&!isDone(t)).forEach(t=>{ (tkByDate[t.due]=tkByDate[t.due]||[]).push(t); });
  const label=first.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const upcoming=events().filter(e=>e.date&&e.date>=today).slice(0,6);
  return `
  <div class="toolbar">
    <button class="icon-btn" data-act="calNav" data-dir="-1" aria-label="Previous month">${ic('back')}</button>
    <h2 style="margin:0;font-size:17px;min-width:170px;text-align:center">${esc(label)}</h2>
    <button class="icon-btn" data-act="calNav" data-dir="1" aria-label="Next month">${ic('chev')}</button>
    <button class="btn sm" data-act="calToday">Today</button>
    <span class="spacer"></span>
    <label class="toggle"><input type="checkbox" data-act="calTasks" ${UI.calTasks!==false?'checked':''}> Show task due dates</label>
  </div>
  <section class="card" style="padding:10px 12px 14px">
    <div class="cal-head">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells.map(dt=>{
      if(!dt) return '<div class="cal-cell empty"></div>';
      const evs=evByDate[dt]||[], tks=tkByDate[dt]||[];
      const dayNum=Number(dt.slice(-2));
      return `<div class="cal-cell ${dt===today?'today':''}">
        <div class="dn">${dayNum}</div>
        ${evs.map(e=>`<button class="cal-item ev" data-act="editEvent" data-id="${e.id}" title="${esc(e.title)}">${e.time?`<b>${esc(e.time)}</b> `:''}${esc(e.title)}</button>`).join('')}
        ${tks.map(t=>`<button class="cal-item tk ${isOver(t)?'over':''}" data-act="editTask" data-id="${t.id}" title="${esc(t.title)}">${esc(t.title)}</button>`).join('')}
      </div>`;
    }).join('')}</div>
  </section>
  <div class="group-h">Upcoming events</div>
  <section class="card">${upcoming.length?upcoming.map(e=>{
    const ets=eventTasks(e.id), doneN=ets.filter(isDone).length;
    const pnames=(e.projectIds||[]).map(id=>S.projects[id]).filter(Boolean).map(p=>p.name);
    return `<div class="task"><div style="min-width:0;grid-column:1/3">
      <button class="ttl" data-act="editEvent" data-id="${e.id}">${esc(e.title)}</button>
      <div class="meta"><span class="chip">${esc(e.type||'Meeting')}</span>${pnames.map(n=>`<span class="chip">${esc(n)}</span>`).join('')}${ets.length?`<span class="chip">${doneN}/${ets.length} tasks done</span>`:''}</div>
    </div><div class="side-meta"><span class="due">${fmtDate(e.date)}${e.time?' · '+esc(e.time):''}</span></div></div>`;
  }).join(''):`<div class="empty-state">No upcoming events.${READONLY?'':`<br><button class="btn gold sm" data-act="newEvent">${ic('plus')}New event</button>`}</div>`}</section>`;
}

function askDelEvent(id){ const e=S.events[id]; if(!e) return; const n=eventTasks(id).length;
  confirmBox('Delete event?',`"${e.title}" will be removed.${n?` Its ${n} task${n===1?'':'s'} stay, just unlinked.`:''}`,'Delete event',()=>{
    eventTasks(id).forEach(t=>put('tasks',t.id,{...t,eventId:null}));
    del('events',id); log(`deleted event "${e.title}"`); }); }


function weekBounds(offset){
  const d=dparse(todayStr()); const dow=(d.getDay()+6)%7; // Monday=0
  d.setDate(d.getDate()-dow+7*(offset||0));
  const days=[]; for(let i=0;i<7;i++){ const x=new Date(d); x.setDate(d.getDate()+i); days.push(dstr(x)); }
  return {start:days[0], end:days[6], days};
}
function viewWeek(){
  const W=weekBounds(UI.weekOffset||0), today=todayStr();
  const inWeek=s=>s&&s>=W.start&&s<=W.end;
  const all=tasks();
  const dueWeek=all.filter(t=>!isDone(t)&&inWeek(t.due));
  const overdue=all.filter(isOver);
  const doneWeek=all.filter(t=>isDone(t)&&t.doneAt&&inWeek(dstr(new Date(t.doneAt))));
  const evWeek=events().filter(e=>inWeek(e.date));
  const isThis=(UI.weekOffset||0)===0;
  const fmtR=`${fmtDate(W.start)} – ${fmtDate(W.end)}`;
  const maxDay=Math.max(1,...W.days.map(d=>all.filter(t=>!isDone(t)&&t.due===d).length+evWeek.filter(e=>e.date===d).length));

  // day strip
  const strip=W.days.map((d,i)=>{
    const dt=all.filter(t=>!isDone(t)&&t.due===d), de=evWeek.filter(e=>e.date===d);
    const n=dt.length+de.length;
    return `<div class="wday ${d===today?'today':''} ${i>4?'wkend':''}">
      <div class="wd-h"><b>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</b><span>${Number(d.slice(-2))}</span></div>
      <div class="wd-bar"><i style="height:${n/maxDay*100}%"></i></div>
      <div class="wd-items">${de.map(e=>`<button class="cal-item ev" data-act="editEvent" data-id="${e.id}" title="${esc(e.title)}">${e.time?`<b>${esc(e.time)}</b> `:''}${esc(e.title)}</button>`).join('')}${dt.map(t=>`<button class="cal-item tk ${isOver(t)?'over':''}" data-act="editTask" data-id="${t.id}" title="${esc(t.title)}">${esc(t.title)}</button>`).join('')}</div>
    </div>`;}).join('');

  // by person
  const ms=members();
  const people=ms.map(m=>{
    const mine=t=>getAssignees(t).includes(m.id);
    const pd=dueWeek.filter(mine), po=overdue.filter(mine), pc=doneWeek.filter(mine);
    const list=[...po.filter(t=>!pd.includes(t)),...pd];
    sortTasks(list,'due');
    return `<section class="card person narrow">
      <div class="card-h"><span class="av">${esc(initials(m))}</span><h2>${esc(m.name)}</h2>
        <span class="pstat">${po.length?`<span class="pill High">${po.length} overdue</span>`:''}<span class="pill">${pd.length} due</span><span class="pill Low">${pc.length} done</span></span></div>
      ${list.length?`<div class="tasks">${list.slice(0,6).map(t=>taskRow(t,{compact:true})).join('')}</div>${list.length>6?`<div class="more">+${list.length-6} more</div>`:''}`:`<div class="empty-state" style="padding:12px 18px">Clear this week.</div>`}
    </section>`;}).join('');
  const unassigned=[...overdue,...dueWeek].filter((t,i,a)=>a.indexOf(t)===i && !getAssignees(t).length);

  // mandate pulse
  const pulse=projects().map(p=>{
    const pt=all.filter(t=>t.projectId===p.id);
    const open=pt.filter(t=>!isDone(t)), od=pt.filter(isOver), dw=open.filter(t=>inWeek(t.due));
    const next=open.filter(t=>t.due).sort((a,b)=>a.due.localeCompare(b.due))[0];
    return {p,open:open.length,od:od.length,dw:dw.length,next,done:pt.filter(isDone).length,total:pt.length};
  }).sort((a,b)=>b.od-a.od||b.dw-a.dw||a.p.name.localeCompare(b.p.name));

  return `
  <div class="toolbar">
    <button class="icon-btn" data-act="weekNav" data-dir="-1" aria-label="Previous week">${ic('back')}</button>
    <h2 style="margin:0;font-size:17px;min-width:200px;text-align:center">${isThis?'This week':'Week of '+fmtDate(W.start)}<span class="sub" style="display:block;font-size:12.5px;font-weight:400;color:var(--muted)">${fmtR}</span></h2>
    <button class="icon-btn" data-act="weekNav" data-dir="1" aria-label="Next week">${ic('chev')}</button>
    ${isThis?'':`<button class="btn sm" data-act="weekNav" data-dir="0">This week</button>`}
  </div>
  <div class="kpis">
    <div class="card kpi">${ic('week')}<div class="l">Due this week</div><div class="v">${dueWeek.length}</div><div class="s">Open tasks</div></div>
    <div class="card kpi b4">${ic('alert')}<div class="l">Overdue</div><div class="v" style="${overdue.length?'color:var(--red)':''}">${overdue.length}</div><div class="s">${overdue.length?'Across all mandates':'All on track'}</div></div>
    <div class="card kpi b3">${ic('tick')}<div class="l">Completed</div><div class="v">${doneWeek.length}</div><div class="s">This week</div></div>
    <div class="card kpi b2">${ic('clock')}<div class="l">Events</div><div class="v">${evWeek.length}</div><div class="s">${evWeek.length?'Meetings & deadlines':'None scheduled'}</div></div>
  </div>
  <section class="card" style="padding:12px"><div class="wstrip">${strip}</div></section>

  <div class="group-h">By person</div>
  <div class="people">${people||`<div class="card empty-state">Add your team on the Team page.</div>`}</div>
  ${unassigned.length?`<div class="group-h">Unassigned <span>${unassigned.length} need an owner</span></div><section class="card narrow"><div class="tasks">${unassigned.map(t=>taskRow(t,{compact:true})).join('')}</div></section>`:''}

  ${(()=>{ const need=projects().filter(needsStatus); if(!need.length) return '';
    return `<div class="group-h">Needs a status update <span>${need.length} mandate${need.length===1?'':'s'} — nothing recorded in ${STALE_DAYS}+ days, or never</span></div>
    <section class="card needs"><div class="needs-list">${need.map(p=>`<div class="need">
      <span class="dot" style="background:${projColor(p)}"></span>
      <button class="nm" data-act="openProject" data-id="${p.id}">${esc(p.name)}</button>
      <span class="why">${p.statusUpdatedAt?`${daysSince(p.statusUpdatedAt)} days since update${statusOf(p)?' · '+esc(statusOf(p).name):''}`:'Never updated'}</span>
      ${READONLY?'':`<button class="btn sm" data-act="updateStatus" data-id="${p.id}">Update</button>`}</div>`).join('')}</div></section>`; })()}
  <div class="grid-dash" style="margin-top:6px">
    <div class="col">
      <div class="group-h" style="margin-bottom:0">Mandate pulse</div>
      <section class="card"><div class="pulse">
        <div class="pr ph"><span>Mandate</span><span>Status</span><span>Open</span><span>Overdue</span><span>Next due</span></div>
        ${pulse.length?pulse.map(r=>`<button class="pr" data-act="openProject" data-id="${r.p.id}">
          <span class="pn"><i class="dot" style="background:${projColor(r.p)}"></i>${esc(r.p.name)}<small>${esc(stageName(r.p.stage))}${r.p.nextStep?' · '+esc(r.p.nextStep):''}</small></span>
          <span class="pst">${statusPill(statusOf(r.p))||'<span class="lbl-s">–</span>'}${isStale(r.p)?`<span class="stale sm" title="${daysSince(r.p.statusUpdatedAt)} days since update">${ic('alert')}</span>`:''}</span>
          <span>${r.open}</span><span class="${r.od?'bad':''}">${r.od||'–'}</span>
          <span class="nd">${r.next?`${fmtDate(r.next.due)}<small>${esc(r.next.title)}</small>`:'–'}</span></button>`).join(''):'<div class="empty-state">No mandates yet.</div>'}
      </div></section>
    </div>
    <div class="col">
      <div class="group-h" style="margin-bottom:0">Wins this week</div>
      <section class="card narrow">${doneWeek.length?`<div class="tasks">${doneWeek.sort((a,b)=>b.doneAt-a.doneAt).slice(0,10).map(t=>taskRow(t,{compact:true})).join('')}</div>`:'<div class="empty-state">Nothing completed yet this week.</div>'}</section>
    </div>
  </div>`;
}

/* ---------- Render ---------- */
let renderQueued=false;
function render(){
  if(renderQueued) return; renderQueued=true;
  requestAnimationFrame(()=>{ renderQueued=false; if(ptrDown){ blurPending=true; return; } doRender(); });
}
function doRender(){
  // don't wipe something the person is typing in the main area
  const ae=document.activeElement;
  const typing = ae && document.getElementById('content').contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName);
  renderNav(); renderBnav();
  if(document.getElementById('commentsList')) renderComments();
  const b=document.getElementById('banner');
  b.innerHTML = READONLY ? '<div class="banner">This account doesn\'t have permission to make changes. Contact your admin.</div>' : '';
  document.getElementById('fab').hidden = READONLY || !S.ready;
  if(typing){ renderTop(); return; }
  renderTop();
  const c=document.getElementById('content');
  if(!S.ready){ c.innerHTML='<div class="loading">Loading your workspace…</div>'; return; }
  const v=UI.view;
  c.innerHTML = '<div class="wrap">' + (
    v==='projects' ? viewBoard() :
    v==='project' ? viewProject() :
    v==='week' ? viewWeek() :
    v==='tasks' ? viewTasks() :
    v==='calendar' ? viewCalendar() :
    v==='team' ? viewTeam() :
    v==='settings' ? viewSettings() : viewDash()
  ) + '</div>';
  wireBoard(); wireTaskDnD();
}

function avatars(ids){ const ms=(ids||[]).map(id=>S.members[id]).filter(Boolean); return ms.length?`<span class="avs">${ms.slice(0,4).map(m=>`<span class="av" title="${esc(m.name)}">${esc(initials(m))}</span>`).join('')}</span>`:''; }
function getAssignees(t){ return t.assignees || (t.assignee?[t.assignee]:[]); }
function assigneeChips(t){
  const ms=getAssignees(t).map(id=>S.members[id]).filter(Boolean);

  return `<span class="chip" title="${ms.map(m=>esc(m.name)).join(', ')}">${ms.map(m=>esc(initials(m))).join(' ')}</span>`;

function taskRow(t, opts={}){
  const p=S.projects[t.projectId];

    <button class="check ${isDone(t)?'on':''}" data-act="toggleTask" data-id="${t.id}" aria-label="${isDone(t)?'Mark not done':'Mark done'}" ${READONLY?'disabled':''}>${isDone(t)?ic('tick'):''}</button>
    <button class="ttl-wrap" data-act="editTask" data-id="${t.id}" style="min-width:0;text-align:left;background:none;border:0;padding:0">
      <span class="ttl">${esc(t.title)}</span>
      <div class="meta">${!opts.hideProject&&p?`<span class="plink" data-act="openProject" data-id="${p.id}">${esc(p.name)}</span>`:''}${taskEvent(t)?`<span class="chip event">${esc(taskEvent(t).title)}</span>`:''}${t.status==='In Progress'?'<span class="chip">In progress</span>':''}${t.recur&&t.recur.freq!=='none'?`<span class="chip recur">${ic('repeat')} ${esc(recurLabel(t.recur))}</span>`:''}${subs.length?`<span class="chip sub-toggle" data-act="expandTask" data-id="${t.id}" role="button" tabindex="0">${ic('chev')}${doneSub}/${subs.length} subtasks</span>`:''}${(t.links||[]).length?`<span class="chip sub-toggle" data-act="expandTask" data-id="${t.id}" role="button" tabindex="0">${ic('link')} ${t.links.length}</span>`:''}${commentsFor(t.id).length?`<span class="chip cmt">${ic('chat')} ${commentsFor(t.id).length}</span>`:''}</div>
    </button>
    <div class="side-meta">
      <span class="pill ${esc(t.priority)}">${esc(t.priority||'Medium')}</span>

    </div>
  </div>
  ${!opts.compact&&expanded?`<div class="subtasks">
    ${subs.map(s=>`<div class="subtask ${s.done?'done':''}"><button class="subcheck ${s.done?'on':''}" data-act="toggleSub" data-id="${t.id}" data-sub="${s.id}" ${READONLY?'disabled':''}>${s.done?ic('tick'):''}</button><span>${esc(s.title)}</span>${READONLY?'':`<button class="icon-btn sm" data-act="delSub" data-id="${t.id}" data-sub="${s.id}" aria-label="Delete subtask">${ic('x')}</button>`}</div>`).join('')}
    ${t.notes?`<p class="task-notes">${esc(t.notes)}</p>`:''}
    ${(t.links||[]).length?`<div class="task-files">${t.links.map(l=>`<a class="file-chip" href="${esc(l.url)}" target="_blank" rel="noopener">${ic('link')}${esc(linkLabel(l))}</a>`).join('')}</div>`:''}
    ${(t.files||[]).length?`<div class="task-files">${t.files.map(f=>`<a class="file-chip" href="${esc(f.url)}" target="_blank" rel="noopener">${ic('brief')}${esc(f.name)}</a>`).join('')}</div>`:''}
  </div>`:''}

}
const sortTasks = (arr, by) => arr.sort((a,b)=>{
  if(isDone(a)!==isDone(b)) return isDone(a)?1:-1;
  if(by==='priority'){ const d=PRIORITIES.indexOf(a.priority)-PRIORITIES.indexOf(b.priority); if(d) return d; }
  return (a.due||'9999').localeCompare(b.due||'9999');
});
const projStats = p => { const ts=tasks().filter(t=>t.projectId===p.id); const d=ts.filter(isDone).length; return {total:ts.length,done:d,open:ts.length-d,pct:ts.length?Math.round(d/ts.length*100):0}; };
function doneSection(doneTs, opts={}){
  if(!doneTs.length) return `<div class="done-section" data-done-drop><summary style="cursor:default">Done <span class="dhint">Drag a task here to mark it complete</span></summary></div>`;

}

function taskCard(t){

function wireTaskDnD(){
  if(READONLY) return;
  document.querySelectorAll('[data-drag-task]').forEach(el=>{
    el.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/plain', el.dataset.dragTask); e.dataTransfer.effectAllowed='move'; });
  });
  document.querySelectorAll('[data-cat-drop]').forEach(el=>{
    el.addEventListener('dragover',e=>{ e.preventDefault(); el.classList.add('drop'); });
    el.addEventListener('dragleave',()=>el.classList.remove('drop'));
    el.addEventListener('drop',e=>{ e.preventDefault(); el.classList.remove('drop'); const id=e.dataTransfer.getData('text/plain'); const t=S.tasks[id]; if(!t) return;
      const cat=el.dataset.catDrop; if(t.category===cat && !isDone(t)) return;
      put('tasks',id,{...t,category:cat,status:t.status==='Done'?'To Do':t.status,doneAt:null,updatedAt:Date.now()}); });
  });
  document.querySelectorAll('[data-done-drop]').forEach(el=>{
    el.addEventListener('dragover',e=>{ e.preventDefault(); el.classList.add('drop'); });
    el.addEventListener('dragleave',()=>el.classList.remove('drop'));
    el.addEventListener('drop',e=>{ e.preventDefault(); el.classList.remove('drop'); const id=e.dataTransfer.getData('text/plain'); const t=S.tasks[id]; if(!t||isDone(t)) return;
      completeTask(t); });
  });
}

/* ---------- Views ---------- */
function viewDash(){
  const ps=projects(), ts=tasks();
  const closedIds=new Set(['closed','declined']);
  const active=ps.filter(p=>!closedIds.has(p.stage)).length;
  const open=ts.filter(t=>!isDone(t)).length, over=ts.filter(isOver).length;
  const weekAgo=Date.now()-7*864e5, doneWeek=ts.filter(t=>isDone(t)&&(t.doneAt||0)>weekAgo).length;
  const counts=stages().map(s=>({s,n:ps.filter(p=>p.stage===s.id).length})); const max=Math.max(1,...counts.map(c=>c.n));
  const upcoming=sortTasks(ts.filter(t=>!isDone(t)&&t.due&&t.due<=addDays(7)),'due');
  const ms=members(); const loads=ms.map(m=>({m,n:ts.filter(t=>!isDone(t)&&getAssignees(t).includes(m.id)).length})); const lmax=Math.max(1,...loads.map(l=>l.n));

    <button class="card kpi b4" data-act="go" data-v="tasks" data-tab="all">${ic('alert')}<div class="l">Overdue</div><div class="v" style="${over?'color:var(--red)':''}">${over}</div><div class="s">${over?'Need attention':'All on track'}</div></button>
    <button class="card kpi b3" data-act="go" data-v="tasks" data-tab="all">${ic('tick')}<div class="l">Done this week</div><div class="v">${doneWeek}</div><div class="s">Tasks completed</div></button>
  </div>
  <div class="grid-dash">
    <div class="col">
      <section class="card"><div class="card-h"><h2>Pipeline overview</h2><button class="btn sm" data-act="go" data-v="projects">Open board</button></div>
        <div class="card-b bars">${counts.map(c=>`<button class="row" data-act="go" data-v="projects"><span class="lbl">${esc(c.s.name)}</span><span class="track"><span class="fill" style="width:${c.n/max*100}%;${c.n?'':'display:none'}"></span></span><span class="n">${c.n}</span></button>`).join('')}</div></section>
      <section class="card"><div class="card-h"><h2>Due soon <span class="sub">(${upcoming.length} ${upcoming.length===1?'task':'tasks'}, overdue and next 7 days)</span></h2><button class="btn sm" data-act="go" data-v="tasks" data-tab="all">View all</button></div>
        ${upcoming.length?`<div class="tasks">${upcoming.slice(0,8).map(t=>taskRow(t,{compact:true})).join('')}</div>`:`<div class="empty-state">Nothing due in the next week.${READONLY?'':`<br><button class="btn gold sm" data-act="newTask">${ic('plus')}New task</button>`}</div>`}
      </section>
    </div>
    <div class="col">
      <section class="card"><div class="card-h"><h2>Team workload</h2><span class="sub">open tasks</span></div>
        <div class="card-b">${ms.length?loads.map(l=>`<div class="wl"><span class="av">${esc(initials(l.m))}</span><span class="nm">${esc(l.m.name.split(' ')[0])}</span><span class="track"><span class="fill" style="width:${l.n/lmax*100}%"></span></span><span class="n">${l.n}</span></div>`).join(''):`<div class="empty-state">No team members yet.${READONLY?'':`<br><button class="btn sm" data-act="newMember">${ic('plus')}Add member</button>`}</div>`}</div></section>
      <section class="card"><div class="card-h"><h2>Recent activity</h2></div>
        <div class="card-b">${acts.length?acts.map(a=>{const w=S.members[a.who];return `<div class="act"><span><b>${esc(w?w.name.split(' ')[0]:'Someone')}</b> ${esc(a.text)}</span><span class="t">${ago(a.at)}</span></div>`}).join(''):'<div class="empty-state">No activity yet. Changes your team makes show up here.</div>'}</div></section>
    </div>

}
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function projCard(p){
  const st=projStats(p);
  const meta=[p.type,p.size,p.region].filter(Boolean).map(esc).join(' · ');
  return `<div class="pcard" ${READONLY?'':'draggable="true"'} data-drag="${p.id}" data-act="openProject" data-id="${p.id}" role="button" tabindex="0">
    <h3>${esc(p.name)}</h3>${meta?`<div class="m">${meta}</div>`:''}
    ${statusOf(p)||isStale(p)?`<div class="pc-status">${statusPill(statusOf(p))}${staleBadge(p)}</div>`:''}
    ${p.nextStep?`<p class="pc-next">${esc(p.nextStep)}</p>`:''}
    ${p.summary?`<p class="sum">${esc(p.summary)}</p>`:''}
    ${st.total?`<div class="prog" title="${st.done} of ${st.total} tasks done"><i style="width:${st.pct}%"></i></div>`:''}
    <div class="f">${avatars(p.team)}<span class="chip">${ic('check')} ${st.open} open</span>${p.target?`<span class="due" style="margin-left:6px">${fmtDate(p.target)}</span>`:''}
      ${READONLY?'':`<span class="pmove"><button class="icon-btn sm" data-act="moveProj" data-id="${p.id}" data-dir="-1" aria-label="Move ${esc(p.name)} up">${ic('up')}</button><button class="icon-btn sm" data-act="moveProj" data-id="${p.id}" data-dir="1" aria-label="Move ${esc(p.name)} down">${ic('down')}</button></span>`}

}
function viewBoard(){

  return `<div class="jump">${stages().map(s=>{const n=ps.filter(p=>p.stage===s.id).length;return `<button data-act="jump" data-stage="${s.id}">${esc(s.name)}${n?`<b>${n}</b>`:''}</button>`}).join('')}</div><div class="board" id="board">${stages().map(s=>{
    const items=ps.filter(p=>p.stage===s.id);

  ${ps.filter(p=>!stages().some(s=>s.id===p.stage)).length?`<div class="colm"><div class="colm-h">No stage</div><div class="colm-b">${ps.filter(p=>!stages().some(s=>s.id===p.stage)).map(projCard).join('')}</div></div>`:''}
  </div>${ps.length?`<p class="board-note lbl-s" style="display:none;text-align:center;margin:14px 0 0">Stages with no mandates are hidden on small screens.</p>`:`<div class="card empty-state board-note" style="display:none">No mandates yet.${READONLY?'':`<br><button class="btn gold sm" data-act="newProject">${ic('plus')}New mandate</button>`}</div>`}`;

function wireBoard(){
  const board=document.getElementById('board'); if(!board||READONLY) return;
  board.querySelectorAll('[data-drag]').forEach(el=>{
    el.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/plain',el.dataset.drag); e.dataTransfer.effectAllowed='move'; });
  });
  board.querySelectorAll('.colm[data-stage]').forEach(col=>{
    col.addEventListener('dragover',e=>{ e.preventDefault(); col.classList.add('drop'); });
    col.addEventListener('dragleave',()=>col.classList.remove('drop'));
    col.addEventListener('drop',e=>{ e.preventDefault(); col.classList.remove('drop'); moveStage(e.dataTransfer.getData('text/plain'), col.dataset.stage); });
  });
}
function moveStage(pid, sid){
  const p=S.projects[pid]; if(!p||p.stage===sid) return;
  put('projects',pid,{...p,stage:sid,updatedAt:Date.now()}); log(`moved ${p.name} to ${stageName(sid)}`);
}

function viewTasks(){
  const m=me(), ps=projects();
  let ts=tasks();
  const tab=UI.taskTab;
  if(tab==='mine') ts=ts.filter(t=>m&&getAssignees(t).includes(m.id));
  else if(tab!=='all') ts=ts.filter(t=>t.projectId===tab);
  const over=ts.filter(isOver).length;
  const doneTs=ts.filter(isDone);
  ts=ts.filter(t=>!isDone(t));
  sortTasks(ts,UI.sort);
  const groups=[...cats().map(c=>c.id), ...new Set(ts.map(t=>t.category||'general').filter(c=>!cats().some(x=>x.id===c)))];
  const allForTab = tab==='mine'?tasks().filter(t=>m&&getAssignees(t).includes(m.id)): tab==='all'?tasks(): tasks().filter(t=>t.projectId===tab);
  const body = groups.map(g=>{
    const items=ts.filter(t=>(t.category||'general')===g);

    const all=allForTab.filter(t=>(t.category||'general')===g);
    return `<div class="group-h">${esc(catName(g))} <span>${all.filter(isDone).length}/${all.length} complete</span></div><section class="card"><div class="tasks" data-cat-drop="${g}">${items.map(t=>taskRow(t,{hideProject:tab!=='mine'&&tab!=='all'})).join('')}</div></section>`;
  }).join('');

}

let formState=null;

    else if(fl.type==='members') input=`<div class="picks" data-picks="${fl.k}">${members().map(m=>`<button type="button" class="${(v||[]).includes(m.id)?'on':''}" data-pick="${m.id}" aria-pressed="${(v||[]).includes(m.id)}"><span class="av">${esc(initials(m))}</span>${esc(m.name)}</button>`).join('')||'<span class="lbl-s">Add team members on the Team page first.</span>'}</div>`;

    else if(fl.type==='projects') input=`<div class="picks" data-picks="${fl.k}">${projects().map(p=>`<button type="button" class="${(v||[]).includes(p.id)?'on':''}" data-pick="${p.id}" aria-pressed="${(v||[]).includes(p.id)}">${esc(p.name)}</button>`).join('')||'<span class="lbl-s">No mandates yet.</span>'}</div>`;
    else if(fl.type==='links') input=`<div class="upload-list" id="linksList"></div>${READONLY?'':`<button type="button" class="btn sm" data-act="addFormLink">${ic('plus')}Add link</button>`}`;
    else if(fl.type==='comments') input=`<div class="comments" id="commentsList" data-task="${fl.taskId}"></div>${READONLY?'':`<div class="comment-add"><textarea id="commentInput" rows="2" placeholder="Add an update, e.g. sent to counsel, waiting on reply"></textarea><button type="button" class="btn sm gold" data-act="postComment" data-id="${fl.taskId}">Post</button></div>`}`;
    else if(fl.type==='subtasks') input=`<div class="sub-editor" id="subtasksEditor"></div>${READONLY?'':`<button type="button" class="btn sm" data-act="promptFormSubtask">${ic('plus')}Add subtask</button>`}`;
    else input=`<input id="${id}" name="${fl.k}" type="${fl.type||'text'}" value="${esc(v)}" placeholder="${esc(fl.ph||'')}" ${fl.req?'required':''} ${fl.max?`maxlength="${fl.max}"`:''}>`;
    const html=`<div class="fld">${(['members','projects','files','subtasks','links','comments'].includes(fl.type))?`<label>${esc(fl.label)}</label>`:`<label for="${id}">${esc(fl.label)}</label>`}${input}${fl.help?`<div class="help">${esc(fl.help)}</div>`:''}</div>`;
    return fl.half?`<!--half-->${html}`:html;
  });
  // pair up half-width fields
  let body='',buf=[];
  f.forEach(h=>{ if(h.startsWith('<!--half-->')){ buf.push(h.slice(11)); if(buf.length===2){ body+=`<div class="two">${buf.join('')}</div>`; buf=[]; } } else { if(buf.length){ body+=buf.join(''); buf=[]; } body+=h; } });
  body+=buf.join('');
  document.getElementById('modal').innerHTML=`<div class="scrim" data-act="closeModal"><form class="sheet" role="dialog" aria-modal="true" aria-labelledby="mh" id="theForm" novalidate>
    <div class="sheet-h"><h2 id="mh">${esc(o.title)}</h2><button type="button" class="icon-btn" data-act="closeModal" aria-label="Close">${ic('x')}</button></div>
    <div class="sheet-b">${body}</div>
    <div class="sheet-f">${o.onDelete?`<button type="button" class="btn danger" data-act="formDelete">${ic('trash')}Delete</button>`:''}<span class="spacer"></span><button type="button" class="btn" data-act="closeModal">Cancel</button><button type="submit" class="btn gold">${esc(o.submit||'Save')}</button></div>
  </form></div>`;
  if(o.fields.some(fl=>fl.type==='files')) renderFilesList();
  if(o.fields.some(fl=>fl.type==='subtasks')) renderSubtasksEditor();
  if(o.fields.some(fl=>fl.type==='links')) renderLinksEditor();
  if(o.fields.some(fl=>fl.type==='comments')) renderComments();
  if(o.fields.some(fl=>fl.k==='recurFreq')) syncRecurDay();
  const first=document.querySelector('#theForm input,#theForm textarea'); if(first && window.innerWidth>760) first.focus();
}

function closeModal(){ document.getElementById('modal').innerHTML=''; formState=null; }
function formValues(){
  const form=document.getElementById('theForm'), out={};

    if(fl.type==='members'||fl.type==='projects') out[fl.k]=[...form.querySelectorAll(`[data-picks="${fl.k}"] button.on`)].map(b=>b.dataset.pick);

function confirmBox(title,text,label,fn,tone){

  document.getElementById('okBtn').onclick=()=>{ closeModal(); fn(); };

function taskForm(t={}, preset={}){

    files: t.files||[],
    subtasks: t.subtasks||[],
    links: t.links||[],
    fields:[
      {k:'title',label:'Task',value:t.title,req:true,ph:'e.g. Review NDA redlines'},
      {k:'eventId',label:'Event',type:'select',value:t.eventId||'',options:[['','None'],...events().map(e=>[e.id, e.title + (e.date?' · '+fmtDate(e.date):'')]),['__new','+ New event…']],half:true,help:'Groups tasks pointing at the same occasion.'},
      {k:'projectId',label:'Mandate',type:'select',value:t.projectId??preset.projectId??'',options:[['','No mandate'],...projects().map(p=>[p.id,p.name])],half:true},
      {k:'assignees',label:'Assigned to',type:'members',value:t.assignees??(t.assignee?[t.assignee]:preset.assignee?[preset.assignee]:(me()?[me().id]:[]))},
      {k:'due',label:'Due date',type:'date',value:t.due,half:true},
      {k:'priority',label:'Priority',type:'select',value:t.priority||'Medium',options:PRIORITIES.map(x=>[x,x]),half:true},
      {k:'status',label:'Status',type:'select',value:t.status||'To Do',options:STATUSES.map(x=>[x,x]),half:true},
      {k:'category',label:'Category',type:'select',value:t.category||preset.category||cats()[0]?.id||'general',options:cats().map(c=>[c.id,c.name]),half:true},
      {k:'recurFreq',label:'Repeats',type:'select',value:(t.recur&&t.recur.freq)||'none',options:RECUR_OPTS,half:true},
      {k:'recurDay',label:'On',type:'select',value:String((t.recur&&t.recur.weekday)??5),options:WEEKDAYS.map((d,i)=>[String(i),d]),half:true,help:'Used for weekly repeats. Monthly repeats use the due date\'s day.'},
      {k:'notes',label:'Notes',type:'textarea',value:t.notes,ph:'Optional details'},
      {k:'links',label:'Links',type:'links',help:'Paste a SharePoint, Drive or Dropbox link to the file.'},
      {k:'subtasks',label:'Subtasks',type:'subtasks'},
      ...(isNew?[]:[{k:'_comments',label:'Comments',type:'comments',taskId:t.id}])
    ],
    onSubmit: v=>{
      if(!v.title) return 'Give the task a name.';
      if(v.eventId==='__new'){ const title=(window.prompt('Name the new event (e.g. 4S introductory meeting):')||'').trim();
        if(!title) return 'Name the event, or choose None.';
        const eid=uid(); const pid=v.projectId||UI.projectId;
        put('events',eid,{id:eid,title,type:'Meeting',date:v.due||'',time:'',projectIds:pid?[pid]:[],notes:'',createdAt:Date.now()});
        v.eventId=eid; }
      const recur = v.recurFreq==='none' ? null : {freq:v.recurFreq, weekday:Number(v.recurDay), monthDay: v.due?Number(v.due.slice(-2)):null};
      delete v.recurFreq; delete v.recurDay; delete v._comments;
      v.recur = recur;
      if(recur && !v.due) v.due = nextOccurrence(recur,'',true);
      const id=t.id||uid(); const data={...t,...v,id,updatedAt:Date.now()}; delete data.assignee; delete data.event;
      if(isNew) data.createdAt=Date.now();
      const becameDone = v.status==='Done' && !isDone(t);
      if(v.status!=='Done') data.doneAt=null;
      if(becameDone){ if(isNew) put('tasks',id,{...data,status:'To Do'}); completeTask({...data,status:'To Do'}); }
      else { put('tasks',id,data); log(isNew?`added task "${v.title}"`:`updated task "${v.title}"`); }
    },
    onDelete: isNew?null:()=>askDelTask(t.id)
  });
}
