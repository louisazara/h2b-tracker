function askDelTask(id){ const t=S.tasks[id]; if(!t) return; confirmBox('Delete task?',`“${t.title}” will be removed. This can't be undone.`,'Delete task',()=>{ del('tasks',id); log(`deleted task “${t.title}”`); }); }
function askDelMember(id){ const m=S.members[id]; if(!m) return; confirmBox('Remove team member?',`${m.name} will be removed. Their tasks stay but become unassigned.`,'Remove',()=>{
  tasks().filter(t=>getAssignees(t).includes(id)).forEach(t=>put('tasks',t.id,{...t,assignees:getAssignees(t).filter(a=>a!==id),assignee:null}));

/* ---------- Settings helpers ---------- */
function saveCfg(next){ put('settings','config',{...DEFAULT_CONFIG,...cfg(),...next}); }
function cfgKey(kind){ return kind==='stage'?'stages':kind==='status'?'statuses':'categories'; }

/* ---------- Events ---------- */
function go(v, extra={}){ Object.assign(UI,{view:v},extra); saveUI(); closeDrawer(); document.getElementById('content').scrollTop=0; render(); }
function closeDrawer(){ document.getElementById('side').classList.remove('open'); document.getElementById('dscrim').classList.remove('on'); }
document.getElementById('dscrim').onclick=closeDrawer;

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id;
  if(a==='closeModal'){ if(e.target===el || el.tagName==='BUTTON'){ e.preventDefault(); closeModal(); } return; }
  if(el.tagName==='A') e.preventDefault();
  // clicks inside a card's action buttons shouldn't open the card
  if(['editMember','delMember'].includes(a)) e.stopPropagation();
  switch(a){
    case 'go': go(el.dataset.v, el.dataset.tab?{taskTab:el.dataset.tab}:{}); break;
    case 'drawer': document.getElementById('side').classList.add('open'); document.getElementById('dscrim').classList.add('on'); break;
    case 'projToggle': UI.projOpen=!UI.projOpen; saveUI(); if(UI.view!=='projects'&&UI.projOpen&&window.innerWidth>1024){} render(); break;
    case 'jump': { const c=document.querySelector(`.colm[data-stage="${el.dataset.stage}"]`); if(c) c.scrollIntoView({behavior:'smooth',inline:'start',block:'nearest'}); break; }
    case 'openProject': go('project',{projectId:id}); break;
    case 'newProject': closeDrawer(); projectForm({}, {stage:el.dataset.stage}); break;
    case 'editProject': projectForm(S.projects[id]); break;
    case 'delProject': askDelProject(id); break;
    case 'setStage': { const p=S.projects[id]; if(p) moveStage(id, el.dataset.stage); break; }
    case 'moveCat': { const list=[...cats()]; const i=list.findIndex(c=>c.id===el.dataset.cat); const j=i+Number(el.dataset.dir);
      if(i<0||j<0||j>=list.length) break; [list[i],list[j]]=[list[j],list[i]]; saveCfg({categories:list}); break; }
    case 'moveProjSide': { e.stopPropagation(); const list=projects(); const i=list.findIndex(x=>x.id===id); const j=i+Number(el.dataset.dir);
      if(i<0||j<0||j>=list.length) break; [list[i],list[j]]=[list[j],list[i]];
      list.forEach((x,k)=>{ if(x.order!==k) put('projects',x.id,{...x,order:k,updatedAt:Date.now()}); });
      break; }
    case 'moveProj': { const p=S.projects[id]; if(!p) break;
      const sib=projects().filter(x=>x.stage===p.stage);
      const i=sib.findIndex(x=>x.id===p.id); const j=i+Number(el.dataset.dir);
      if(i<0||j<0||j>=sib.length) break;
      // keep the same set of order values, just hand them out in the new sequence
      const slots=sib.map((x,k)=> typeof x.order==='number'? x.order : k).sort((a,b)=>a-b);
      [sib[i],sib[j]]=[sib[j],sib[i]];
      sib.forEach((x,k)=>{ if(x.order!==slots[k]) put('projects',x.id,{...x,order:slots[k],updatedAt:Date.now()}); });
      break; }
    case 'addFormLink': { const url=cleanUrl(window.prompt('Paste the link:')||''); if(!url) break;
      const label=(window.prompt('Name it (optional), e.g. "Term sheet v3":')||'').trim();
      formState.links.push({url,label}); renderLinksEditor(); break; }
    case 'removeFormLink': { formState.links.splice(Number(el.dataset.idx),1); renderLinksEditor(); break; }
    case 'postComment': { const ta=document.getElementById('commentInput'); const txt=(ta&&ta.value||'').trim();
      if(!txt){ toast('Type a comment first.'); ta&&ta.focus(); break; }
      addComment(id, txt); ta.value=''; renderComments(); break; }
    case 'delComment': { del('comments', id); setTimeout(renderComments,0); break; }
    case 'updateStatus': statusForm(S.projects[id]); break;
    case 'newEvent': eventForm({}, {projectId: UI.view==='project'?UI.projectId:''}); break;
    case 'editEvent': eventForm(S.events[id]); break;
    case 'newTaskInCat': taskForm({}, {projectId: UI.projectId, category: el.dataset.cat}); break;
    case 'jumpCat': { const c=document.querySelector(`.catcol[data-cat-drop="${el.dataset.cat}"]`); if(c) c.scrollIntoView({behavior:'smooth',block:'nearest'}); break; }
    case 'calNav': { const cur=UI.calMonth?new Date(UI.calMonth+'-01T12:00:00'):new Date(); cur.setMonth(cur.getMonth()+Number(el.dataset.dir)); UI.calMonth=monthKey(cur); saveUI(); render(); break; }
    case 'weekNav': { const d=Number(el.dataset.dir); UI.weekOffset = d===0?0:(UI.weekOffset||0)+d; saveUI(); render(); break; }
    case 'calToday': { UI.calMonth=monthKey(new Date()); saveUI(); render(); break; }
    case 'exportBackup': exportBackup(); break;
    case 'restoreBackup': document.getElementById('restoreInput').click(); break;
    case 'applyCats': confirmBox('Apply suggested categories?','Renames and merges your categories onto: '+SUGGESTED_CATS.join(', ')+'. Every task stays attached to its category.','Apply',applySuggestedCats,'neutral'); break;
    case 'newTask': taskForm({}, {projectId: UI.view==='project'?UI.projectId:(UI.view==='tasks'&&!['mine','all'].includes(UI.taskTab)?UI.taskTab:'')}); break;
    case 'editTask': taskForm(S.tasks[id]); break;
    case 'delTask': askDelTask(id); break;
    case 'toggleTask': { const t=S.tasks[id]; if(!t) break; if(!isDone(t)) completeTask(t); else put('tasks',id,{...t,status:'To Do',doneAt:null,updatedAt:Date.now()}); break; }
    case 'toggleDone': { e.preventDefault(); UI.doneOpen=!UI.doneOpen; saveUI(); render(); break; }
    case 'expandTask': { const i=UI.expandedTasks.indexOf(id); if(i>-1) UI.expandedTasks.splice(i,1); else UI.expandedTasks.push(id); saveUI(); render(); break; }
    case 'toggleSub': { const t=S.tasks[id]; if(!t) break; const subs=(t.subtasks||[]).map(s=>s.id===el.dataset.sub?{...s,done:!s.done}:s); put('tasks',id,{...t,subtasks:subs,updatedAt:Date.now()}); break; }
    case 'delSub': { const t=S.tasks[id]; if(!t) break; put('tasks',id,{...t,subtasks:(t.subtasks||[]).filter(s=>s.id!==el.dataset.sub),updatedAt:Date.now()}); break; }
    case 'newMember': memberForm(); break;
    case 'editMember': e.stopPropagation(); memberForm(S.members[id]); break;
    case 'delMember': e.stopPropagation(); askDelMember(id); break;
    case 'signOut': confirmBox('Sign out?','You\'ll need your email and password to sign back in.','Sign out',()=>auth.signOut(),'neutral'); break;
    case 'taskTab': UI.taskTab=el.dataset.v; saveUI(); render(); break;
    case 'sort': UI.sort=el.dataset.v; saveUI(); render(); break;
    case 'formDelete': { const fn=formState.onDelete; closeModal(); fn(); break; }
    case 'addItem': { const kind=el.dataset.kind, k=cfgKey(kind); const items=[...(kind==='status'?statuses():(cfg()[k]||[]))]; items.push(kind==='status'?{id:uid(),name:'New status',color:'navy'}:{id:uid(),name:kind==='stage'?'New stage':'New category'}); saveCfg({[k]:items}); break; }
    case 'moveItem': { const k=cfgKey(el.dataset.kind); const items=[...(el.dataset.kind==='status'?statuses():(cfg()[k]||[]))]; const i=items.findIndex(x=>x.id===id), j=i+Number(el.dataset.dir); if(j<0||j>=items.length) break; [items[i],items[j]]=[items[j],items[i]]; saveCfg({[k]:items}); break; }
    case 'uploadFile': { if(!ASSETS){ toast('File uploads aren\'t available in this view.'); break; } document.getElementById('fileInput').click(); break; }
    case 'removeFile': { const i=Number(el.dataset.idx); const f=formState.files[i]; formState.files.splice(i,1); renderFilesList(); if(f) ASSETS.delete(f).catch(()=>{}); break; }
    case 'promptFormSubtask': { const title=(window.prompt('Subtask name:')||'').trim(); if(!title) break; formState.subtasks.push({id:uid(),title,done:false}); renderSubtasksEditor(); break; }
    case 'removeFormSubtask': { formState.subtasks.splice(Number(el.dataset.idx),1); renderSubtasksEditor(); break; }
    case 'toggleFormSubtask': { const i=Number(el.dataset.idx); formState.subtasks[i]={...formState.subtasks[i],done:!formState.subtasks[i].done}; renderSubtasksEditor(); break; }
    case 'delItem': { const kind=el.dataset.kind, k=cfgKey(kind);
      if(kind==='status'){ const items=statuses(); const it=items.find(x=>x.id===id); if(!it) break;
        const aff=projects().filter(p=>p.statusId===id);
        const go3=()=>{ aff.forEach(p=>put('projects',p.id,{...p,statusId:null})); saveCfg({statuses:items.filter(x=>x.id!==id)}); };
        if(aff.length) confirmBox(`Delete "${it.name}"?`,`${aff.length} mandate${aff.length===1?'':'s'} currently marked "${it.name}" will show no status until someone updates ${aff.length===1?'it':'them'}.`,'Delete',go3); else go3();
        break; }
      const items=cfg()[k]||[]; const it=items.find(x=>x.id===id);
      if(items.length<=1){ toast(`Keep at least one ${kind==='stage'?'stage':'category'}.`); break; }
      const rest=items.filter(x=>x.id!==id), fallback=rest[0];
      const affected = kind==='stage'?projects().filter(p=>p.stage===id):tasks().filter(t=>(t.category||'general')===id);
      const go2=()=>{ affected.forEach(x=> kind==='stage'?put('projects',x.id,{...x,stage:fallback.id}):put('tasks',x.id,{...x,category:fallback.id})); saveCfg({[k]:rest}); };
      if(affected.length) confirmBox(`Delete “${it.name}”?`,`${affected.length} ${kind==='stage'?'mandate':'task'}${affected.length===1?'':'s'} will move to “${fallback.name}”.`,'Delete',go2); else go2();
      break; }
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(document.getElementById('modal').innerHTML) closeModal(); closeDrawer(); hideResults(); }
  if((e.key==='Enter'||e.key===' ') && e.target.matches('[role="button"][data-act]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('click',e=>{ const pk=e.target.closest('[data-pick]'); if(pk){ pk.classList.toggle('on'); pk.setAttribute('aria-pressed',pk.classList.contains('on')); } });
document.addEventListener('submit',e=>{
  if(e.target.id==='theForm'){ e.preventDefault(); const err=formState.onSubmit(formValues()); if(typeof err==='string'){ toast(err); return; } closeModal(); return; }
});
document.addEventListener('change',e=>{
  if(e.target.id==='fileInput'){ const file=e.target.files[0]; if(!file||!ASSETS) return;
    const btn=document.querySelector('[data-act="uploadFile"]'); if(btn){ btn.disabled=true; btn.textContent='Uploading…'; }
    ASSETS.upload(file).then(res=>{ formState.files.push({id:res.id,url:res.url,path:res.path,name:file.name,contentType:res.contentType}); renderFilesList(); })
      .catch(()=>toast('Couldn\'t upload that file.'))
      .finally(()=>{ if(btn){ btn.disabled=false; btn.innerHTML=ic('plus')+'Add file'; } e.target.value=''; });
    return;
  }
  if(e.target.id==='f_recurFreq'){ syncRecurDay(); return; }
  if(e.target.dataset.act==='calTasks'){ UI.calTasks=e.target.checked; saveUI(); render(); return; }
  if(e.target.id==='restoreInput'){ const f=e.target.files[0]; if(f) restoreBackup(f); e.target.value=''; return; }
  if(e.target.dataset.set){ const k=e.target.dataset.set, v=e.target.value.trim();
    if(k==='workspace'){ saveCfg({workspace:v||'DealFlow Pro'}); return; }
    if(k==='statusColor'){ saveCfg({statuses:statuses().map(x=>x.id===e.target.dataset.id?{...x,color:v}:x)}); return; }
    if(k==='status'){ saveCfg({statuses:statuses().map(x=>x.id===e.target.dataset.id?{...x,name:v||x.name}:x)}); return; }
    const key=cfgKey(k); const items=(cfg()[key]||[]).map(x=>x.id===e.target.dataset.id?{...x,name:v||x.name}:x); saveCfg({[key]:items}); }
});
// Refresh after someone leaves a text box, but never mid-click: re-rendering between
// mousedown and click would swap the button out from under the pointer and eat the click.
let ptrDown=false, blurPending=false;
function renderAfterBlur(){ const ae=document.activeElement; if(!(ae && document.getElementById('content').contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName))) render(); }
document.addEventListener('pointerdown',()=>{ ptrDown=true; },true);
document.addEventListener('pointerup',()=>{ setTimeout(()=>{ ptrDown=false; if(blurPending){ blurPending=false; renderAfterBlur(); } },0); },true);
document.addEventListener('pointercancel',()=>{ ptrDown=false; if(blurPending){ blurPending=false; renderAfterBlur(); } },true);
document.addEventListener('focusout',e=>{
  if(ptrDown){ blurPending=true; return; }
  setTimeout(renderAfterBlur,0);
});

/* FAB */
document.getElementById('fab').onclick=e=>{
  e.stopPropagation(); const fm=document.getElementById('fabMenu');
  if(fm.innerHTML){ fm.innerHTML=''; return; }
  fm.innerHTML=`<div class="fab-menu"><button data-act="newTask">${ic('check')}New task</button><button data-act="newProject">${ic('brief')}New mandate</button><button data-act="newMember">${ic('users')}Add team member</button></div>`;
};
document.addEventListener('click',e=>{ if(!e.target.closest('#fab')) document.getElementById('fabMenu').innerHTML=''; });

/* Search */
const q=document.getElementById('q'), res=document.getElementById('results');
function hideResults(){ res.hidden=true; }
q.addEventListener('input',()=>{
  const s=q.value.trim().toLowerCase(); if(!s){ hideResults(); return; }
  const ps=projects().filter(p=>[p.name,p.type,p.region,p.summary].join(' ').toLowerCase().includes(s)).slice(0,6);
  const ts=tasks().filter(t=>(t.title+' '+(t.notes||'')).toLowerCase().includes(s)).slice(0,8);
  res.innerHTML = (ps.length?`<div class="g">MANDATES</div>`+ps.map(p=>`<button data-act="openProject" data-id="${p.id}">${esc(p.name)}</button>`).join(''):'')
    + (ts.length?`<div class="g">TASKS</div>`+ts.map(t=>`<button data-act="editTask" data-id="${t.id}">${esc(t.title)}</button>`).join(''):'')
    || '<div class="none">No matches</div>';
  res.hidden=false;
});
res.addEventListener('click',()=>{ q.value=''; hideResults(); });
document.addEventListener('click',e=>{ if(!e.target.closest('.search')) hideResults(); });

/* Toast */
let tt; function toast(msg){ const t=document.getElementById('toast'); t.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(tt); tt=setTimeout(()=>t.innerHTML='',3200); }

boot();
</script>
